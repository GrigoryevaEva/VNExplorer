name: Checks
on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run lint:styles
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm run test:unit
            - run: npm run test:automation
            - name: Require this branch's changeset
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_BASE: ${{ github.event.before }}
              run: |
                  base="$PR_BASE"
                  if [ -z "$base" ]; then base="$PUSH_BASE"; fi
                  if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base=$(git rev-list --max-parents=0 HEAD); fi
                  npm run changeset:check -- "$base"
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - name: Browser checks
              run: npm run test:e2e
            - name: Production route smoke
              run: npm run test:production
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-test-results
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
